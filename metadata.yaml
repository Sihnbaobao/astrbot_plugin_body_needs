name: astrbot_plugin_body_needs
display_name: 身体 · 生理需求
short_desc: 让她会饿、会渴、会累，也有自己的生理周期
desc: >-
  给 Persona 一副按真实时间运转的身体：饥饿、口渴、如厕、清洁、口腔、睡眠，
  以及女性生理期（含青春期）和男性的生理反应。状态会写进对话上下文，
  也会随吃喝洗漱真实改变。
help: >-
  在聊天里用 /身体 看状态，用 /身体 喂、喝水、洗澡、刷牙、上厕所、小睡照顾她。
  她会因为时间流逝真的饿、真的渴、真的困；女性人格有生理期，青春期角色另有初潮门槛和不规律周期，
  男性人格有梦遗、晨勃和白天反应。成人内容由开关、性别识别和私聊共同决定，年龄只影响生理曲线。
