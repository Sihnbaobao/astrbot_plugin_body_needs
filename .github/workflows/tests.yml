name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pytest pytest-asyncio ruff==0.15.22
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Test
        run: python -m pytest -q
